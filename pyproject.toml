[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deep_spine"
version = "0.1.0"
description = "Neuromechanical simulation of spinal circuits and their self-organization"
readme = "README.md"
license = "BSD-3-Clause AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]
authors = [{ name = "Jonathan Realmuto", email = "jdrealmuto@gmail.com" }]
requires-python = "==3.13.*"
# Exact versions that produced the published results (simulations are
# byte-identical only with these; numpy 2.2.6 and mujoco 3.3.5 have no wheels
# for Python 3.14). Ranges may replace them in a later release.
dependencies = [
    "mujoco==3.3.5",
    "numpy==2.2.6",
    "torch==2.9.0",
    "scipy==1.16.2",
    "gymnasium==1.2.0",
    "stable-baselines3==2.7.0",
    "tensorboard==2.20.0",
    "av==15.1.0",
    "opencv-python==4.12.0.88",
    "PyOpenGL==3.1.10",
    "pillow==11.3.0",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
# Only deep_spine/utils/analysis_tools.py needs these.
analysis = [
    "h5py==3.15.1",
    "pandas==2.3.2",
    "plotnine==0.15.1",
    "tbparse==0.0.9",
]

[project.scripts]
deep-spine = "deep_spine.cli:main"

[tool.setuptools.packages.find]
include = ["deep_spine*"]

[tool.setuptools.package-data]
deep_spine = ["environments/*.xml"]
